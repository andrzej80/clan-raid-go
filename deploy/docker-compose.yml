networks:
  app:
    driver: bridge
      
volumes:
  pg_data:
  vm_data:
  tempo_data:
  grafana_data:

services:
  pg:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
  redis:
    image: redis:6.2.6-alpine
    networks:
      - app
    ports:
      - "${REDIS_PORT}:6379"

  # Kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks:
      - app
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["dev"]
    depends_on:
      - kafka
    networks:
      - app
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: [ "--config=/etc/otel-collector-config.yml" ]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    networks:
      - app
    ports:
      - 4318:4318  # OTLP HTTP
      - 4317:4317  # OTLP gRPC
      - 55681:55681  # legacy
      - 8888:8888  # metrics
      - 13133:13133 # health
    depends_on:
      - tempo
      - victoriametrics

  # --- VictoriaMetrics ---
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: victoriametrics
    volumes:
      - vm_data:/storage
    command:
      - '-storageDataPath=/storage'
      - '-httpListenAddr=:8428'
    # Порт 8428 можно не пробрасывать наружу, если собирать метрики будет только коллектор, 
    # но оставим для Grafana и тестов
    ports:
      - "8428:8428"
    networks:
      - app
    restart: always

  # --- Grafana Tempo ---
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - app
    restart: always

  # --- Grafana ---
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - app
    restart: always
  api:
    build:
      context: ../       
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    networks:
      - app                  
    ports:
      - "${APP_PORT}:${APP_PORT}"          
    environment:
      - GRPC_REFLECTION=${GRPC_REFLECTION}
      - APP_PORT=${APP_PORT}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB} 
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 
      - OTEL_SERVICE_NAME=api
    depends_on:
      - pg
      - redis
      - kafka
      - otel-collector
  grpcui:
    image: fullstorydev/grpcui
    profiles: ["dev"]
    command: ["-plaintext", "-bind", "0.0.0.0", "-port", "8082", "api:${APP_PORT}"]
    ports: ["${GRPCUI_PORT}:8082"]
    depends_on: [api]