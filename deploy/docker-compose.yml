networks:
  app:
    driver: bridge
      
# Проба сервисов приложения: /readyz на порту проб (PROBE_ADDR, по умолчанию :8081) внутри контейнера.
# Порт наружу не публикуется: там же pprof. wget есть в alpine-образе (busybox).
x-probe-healthcheck: &probe-healthcheck
  test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 20s

volumes:
  pg_data:
  vm_data:
  tempo_data:
  loki_data:
  grafana_data:

services:
  pg:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:6.2.6-alpine
    networks:
      - app
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    networks:
      - app
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Топики создаёт только kafka-init (raidctl topics apply). Автосоздание дало бы топик с одной
      # партицией и настройками по умолчанию, и ошибку в имени топика никто бы не заметил.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Одноразовый контейнер: приводит топики к описанию в коде (internal/kafka/topics.go: партиции,
  # retention, min.insync.replicas) и завершается. Партиции и фактор репликации существующих
  # топиков не меняет: при расхождении выходит с ошибкой, и сервисы не стартуют.
  kafka-init:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: raidctl
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - app
    restart: "no"
    environment:
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_REPLICATION_FACTOR=${KAFKA_REPLICATION_FACTOR:-1}
    command: ["./server", "topics", "apply", "--wait", "2m"]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["dev"]
    depends_on:
      - kafka
    networks:
      - app
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: [ "--config=/etc/otel-collector-config.yml" ]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    networks:
      - app
    ports:
      - 4318:4318  # OTLP HTTP
      - 4317:4317  # OTLP gRPC
      - 55681:55681  # legacy
      - 8888:8888  # metrics
      - 13133:13133 # health
    depends_on:
      - tempo
      - victoriametrics
      - loki

  # --- VictoriaMetrics ---
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    container_name: victoriametrics
    volumes:
      - vm_data:/storage
    command:
      - '-storageDataPath=/storage'
      - '-httpListenAddr=:8428'
    # Порт 8428 можно не пробрасывать наружу, если собирать метрики будет только коллектор, 
    # но оставим для Grafana и тестов
    ports:
      - "8428:8428"
    networks:
      - app
    restart: always

  # --- vmalert: правила SLI и алерты (deploy/alerts, этап 11, B1/B2) ---
  # Recording rules пишутся обратно в VictoriaMetrics, состояние алертов — тоже (ряд ALERTS), его
  # видно в Grafana. Уведомлений нет (-notifier.blackhole): в продакшене здесь адрес Alertmanager.
  # Активные алерты: http://localhost:8880/vmalert/alerts
  vmalert:
    image: victoriametrics/vmalert:v1.153.0
    container_name: vmalert
    volumes:
      - ./alerts:/etc/alerts:ro
    command:
      - '-rule=/etc/alerts/*.yml'
      - '-datasource.url=http://victoriametrics:8428'
      - '-remoteWrite.url=http://victoriametrics:8428'
      - '-remoteRead.url=http://victoriametrics:8428'
      - '-notifier.blackhole'
      - '-evaluationInterval=1m'
      - '-httpListenAddr=:8880'
    ports:
      - "8880:8880"
    depends_on:
      - victoriametrics
    networks:
      - app
    restart: always

  # --- Grafana Tempo ---
  tempo:
    image: grafana/tempo:2.4.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yml" ]
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - app
    restart: always

  # --- Grafana Loki: логи сервисов (приходят из коллектора по OTLP) ---
  loki:
    image: grafana/loki:3.5.0
    container_name: loki
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - app
    restart: always

  # --- Grafana ---
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - app
    restart: always
  api:
    build:
      context: ../       
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    networks:
      - app                  
    ports:
      - "${APP_PORT}:${APP_PORT}"          
    environment:
      - GRPC_REFLECTION=${GRPC_REFLECTION}
      - APP_PORT=${APP_PORT}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB} 
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 
      - OTEL_SERVICE_NAME=api
      - OTEL_METRIC_EXPORT_INTERVAL=${API_METRIC_INTERVAL_MS:-10000}
      # Эксперимент этапа 9 (loadtest/hotrow.sh): режим приёма ударов и размер пула api.
      # По умолчанию поведение прежнее: Kafka и пул по умолчанию (5).
      - ATTACK_MODE=${ATTACK_MODE:-kafka}
      - PG_MAX_CONNS=${API_PG_MAX_CONNS:-5}
    healthcheck: *probe-healthcheck
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  grpcui:
    image: fullstorydev/grpcui
    profiles: ["dev"]
    command: ["-plaintext", "-bind", "0.0.0.0", "-port", "8082", "api:${APP_PORT}"]
    ports: ["${GRPCUI_PORT}:8082"]
    depends_on: [api]
  hits-consumer:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: hits-consumer
    container_name: hits-consumer
    restart: unless-stopped
    networks:
      - app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB}
      # По одной транзакции на партицию raid.hits (12) плюс запас.
      - PG_MAX_CONNS=16
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=hits-consumer
      - OTEL_METRIC_EXPORT_INTERVAL=10000
    healthcheck: *probe-healthcheck
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  # Без container_name, чтобы relay масштабировался: docker compose up -d --scale outbox-relay=3.
  # Экземпляры не мешают друг другу: записи берутся FOR UPDATE SKIP LOCKED.
  outbox-relay:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: outbox-relay
    restart: unless-stopped
    networks:
      - app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB}
      # Транзакция держит соединение на время отправки в Kafka; больше одной за раз relay не делает,
      # запас нужен для метрики размера outbox.
      - PG_MAX_CONNS=4
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=outbox-relay
      - OTEL_METRIC_EXPORT_INTERVAL=10000
    healthcheck: *probe-healthcheck
    depends_on:
      pg:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  rewards-worker:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: rewards-worker
    container_name: rewards-worker
    restart: unless-stopped
    networks:
      - app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB}
      # По одной транзакции на партицию raid.events (6) плюс запас.
      - PG_MAX_CONNS=8
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=rewards-worker
      - OTEL_METRIC_EXPORT_INTERVAL=10000
    healthcheck: *probe-healthcheck
    depends_on:
      pg:
        condition: service_healthy
      kafka:
        condition: service_healthy
      otel-collector:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
  scheduler:
    build:
      context: ../
      dockerfile: Dockerfile
      args:
        SERVICE: scheduler
    container_name: scheduler
    restart: unless-stopped
    networks:
      - app
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg:5432/${POSTGRES_DB}
      - PG_MAX_CONNS=2
      - SCHEDULER_INTERVAL=10s
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=scheduler
      - OTEL_METRIC_EXPORT_INTERVAL=10000
    healthcheck: *probe-healthcheck
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
