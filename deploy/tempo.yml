server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    # Локальное хранилище: удаление скомпактированных блоков (раз в 10 минут) может пересечься с опросом
    # списка блоков и сорвать его (`failed to poll or create index`); до следующего чистого опроса
    # поиск не видит часть трейсов. Частый опрос сокращает это окно с 5 минут (по умолчанию) до минуты.
    blocklist_poll: 1m
    local:
      path: /var/tempo/blobs
    wal:
      path: /var/tempo/wal